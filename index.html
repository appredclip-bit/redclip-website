<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDclip 小红夹 | All-in-One Global Business Solutions</title>
<meta name="description" content="Manage global entities, statutory records, directors, shareholders and corporate documents securely through one entity management platform.">
<meta name="keywords" content="global entity management, entity management software, corporate records management, legal entity management, AI compliance software, KYC software, KYB solutions, automated compliance, customer due diligence, compliance deadline tracking, filing deadline reminders, statutory compliance calendar, compliance reminder software, CRM workflow automation, client onboarding software, business process automation, sales pipeline management, professional services CRM, document automation software, corporate document generation, legal document automation, automated business documents, accounting status tracking, accounting workflow software, bookkeeping task management, financial reporting tracker, AI secretary, AI virtual secretary, agentic AI infrastructure, enterprise AI agents, AI workflow automation, secure client portal, statutory records portal, corporate document portal, client document management, white-label client portal, embedded payments, integrated payment solutions, business payment platform, automated payment reconciliation, client portal payments, Redclip Pay, cross-border payments, digital payment platform, business payment solutions, FinTech solutions, offshore services marketplace, offshore company formation, global corporate services, international company registration, cross-border corporate services">
<link rel="icon" type="image/png" href="assets/brand-icon.png">
<link rel="apple-touch-icon" href="assets/brand-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ED1B34;
  --red-dark:#C8102E;
  --ink:#111114;
  --grey:#55555c;
  --bg:#ffffff;      /* pure white site background */
  --bg-2:#e6e3e1;
  --white:#ffffff;
  --nav-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{
  scroll-behavior:auto;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","cv11";
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
}
::selection{background:var(--red);color:#fff;}

/* ---------- NAV ---------- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--nav-h);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 clamp(20px,3vw,44px);
  background:transparent;      /* video runs right under the header */
  pointer-events:none;         /* only the links themselves catch clicks */
}
nav > *{pointer-events:auto;}
.nav-center{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(18px,2.4vw,36px);
}
.nav-right{justify-self:end;}
.logo{display:flex;line-height:1;cursor:pointer;user-select:none;text-decoration:none;}
.logo img{height:44px;width:auto;display:block;}
.nav-right{display:flex;align-items:center;gap:clamp(14px,2.1vw,30px);}
.login-btn{
  position:relative;text-decoration:none;color:var(--ink);
  font-weight:500;font-size:14px;letter-spacing:-.01em;white-space:nowrap;
  transition:color .35s ease;
}
/* --- nav links + services dropdown --- */
.nav-item{
  position:relative;background:none;border:none;padding:0;cursor:pointer;
  font-family:inherit;font-weight:500;font-size:14px;letter-spacing:-.01em;
  color:var(--ink);text-decoration:none;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;transition:color .25s ease;
}
.nav-item:hover{color:var(--red);}
.nav-item .caret{
  width:9px;height:9px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;
  transform:rotate(45deg) translate(-1px,-1px);transition:transform .3s ease;
}
.nav-drop{position:relative;}
.nav-drop.open .nav-item .caret{transform:rotate(-135deg) translate(-2px,-2px);}
.nav-drop.open .nav-item{color:var(--red);}
/* mega-panel: explore card on the left, service categories on the right */
.drop-menu{
  position:absolute;top:calc(100% + 16px);left:50%;transform:translate(-50%,-8px) scale(.985);
  width:min(780px,94vw);
  background:#ffffff;
  border:1px solid rgba(17,17,20,.07);border-radius:22px;
  box-shadow:0 34px 90px rgba(17,17,20,.18),0 4px 14px rgba(17,17,20,.05);
  padding:14px;
  display:grid;grid-template-columns:230px 1fr;gap:16px;
  opacity:0;visibility:hidden;
  transition:opacity .26s ease,transform .26s cubic-bezier(.22,.9,.26,1),visibility .26s;
}
.nav-drop.open .drop-menu{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1);}
.drop-eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(17,17,20,.38);margin-bottom:12px;
}
.drop-explore{
  background:#f6f5f4;border-radius:14px;padding:18px;
  display:flex;flex-direction:column;
}
.drop-explore p{
  font-size:14.5px;line-height:1.5;color:var(--ink);font-weight:500;
  letter-spacing:-.01em;
}
.drop-explore .drop-view{
  margin-top:auto;padding-top:22px;
  background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;
  font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em;
  transition:color .2s ease;
}
.drop-explore .drop-view:hover{color:var(--red);}
.drop-cats{padding:6px 4px;}
.drop-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;}
.drop-grid button{
  display:block;text-align:left;background:none;border:none;cursor:pointer;
  font-family:inherit;padding:8px 10px;border-radius:10px;
  transition:background .18s ease;
}
.drop-grid button b{
  display:block;font-size:14px;font-weight:600;color:var(--ink);
  letter-spacing:-.015em;line-height:1.3;transition:color .18s ease;
}
.drop-grid button span{
  display:block;margin-top:1px;font-size:12px;color:#8a8a92;line-height:1.35;
}
.drop-grid button:hover{background:rgba(237,27,52,.05);}
.drop-grid button:hover b{color:var(--red);}
.drop-grid .full{grid-column:1/-1;}
.nav-cta{
  background:var(--red);color:#fff;border-radius:9px;padding:9px 16px;
  font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;
  transition:background .2s,transform .2s;
}
.nav-cta:hover{background:var(--red-dark);transform:translateY(-1px);}
@media (max-width:820px){
  .nav-item.hide-sm{display:none;}
  .drop-menu{grid-template-columns:1fr;width:min(320px,90vw);}
  .drop-explore{display:none;}          /* list only — the card needs width */
  .drop-grid{grid-template-columns:1fr;max-height:62vh;overflow-y:auto;}
}
/* phones: stop centring the links so the three groups can't collide */
@media (max-width:640px){
  nav{display:flex;justify-content:space-between;padding:0 14px;}
  .nav-center{gap:0;}
  .nav-right{gap:12px;}
  .logo img{height:36px;}
  .nav-item{font-size:13px;}
  .login-btn{font-size:12.5px;}
  .nav-cta{padding:8px 12px;font-size:13px;}
  .drop-menu{left:auto;right:-40px;transform:translate(0,-8px) scale(.985);}
  .nav-drop.open .drop-menu{transform:translate(0,0) scale(1);}
}
@media (max-width:342px){
  .login-btn{display:none;}             /* only the very narrowest phones */
}
.login-btn::after{                    /* thin underline grows in on hover */
  content:"";position:absolute;left:0;right:0;bottom:-6px;height:1.5px;
  background:var(--red);transform:scaleX(0);transform-origin:left;
  transition:transform .3s cubic-bezier(.22,.9,.26,1);
}
.login-btn:hover{color:var(--red);}
.login-btn:hover::after{transform:scaleX(1);}

/* ---------- JOURNEY (scroll-scrubbed video + horizontal panels) ---------- */
#journey{height:2600vh;position:relative;}  /* real height set by JS */
.hero-sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--bg);}
.hero-sticky video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
}
#vidStack{position:absolute;inset:0;z-index:1;}  /* videos stack in order; each fades in over the last */
/* one constant veil for the whole journey — the strand always sits behind white */
.page-veil{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:rgba(255,255,255,.88);
  opacity:0;   /* entry shows the raw strand; the loop brings the veil in with the wipe */
}
.hero-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start;
  padding:0 7vw;pointer-events:none;z-index:3;
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--red);font-weight:600;font-size:13px;letter-spacing:.08em;
  margin-bottom:20px;
}
.hero-kicker::before{content:"";width:28px;height:2px;background:var(--red);display:inline-block;}
.hero-title{
  font-size:clamp(38px,5.6vw,78px);font-weight:600;line-height:1.05;
  letter-spacing:-.035em;max-width:14ch;
}
.hero-title .red{color:var(--red);}
.hero-cn{
  margin-top:16px;font-size:clamp(15px,1.6vw,21px);font-weight:600;color:var(--grey);
  letter-spacing:.16em;
}
.hero-sub{
  margin-top:22px;max-width:54ch;font-size:clamp(15px,1.25vw,17.5px);
  line-height:1.6;color:var(--grey);font-weight:400;
}
.hero-ctas{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;pointer-events:auto;}
.btn{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-weight:600;font-size:14.5px;letter-spacing:-.01em;text-decoration:none;
  padding:12px 22px;border-radius:10px;border:none;transition:all .2s ease;
}
.btn-red{background:var(--red);color:#fff;box-shadow:0 1px 2px rgba(17,17,20,.08),0 6px 18px rgba(237,27,52,.22);}
.btn-red:hover{background:var(--red-dark);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(17,17,20,.2);}
.btn-ghost:hover{border-color:var(--ink);background:rgba(17,17,20,.04);}
.hero-fade{transition:opacity .5s ease,transform .5s ease;}
.hero-scrolled .hero-fade{opacity:0;transform:translateY(-30px);pointer-events:none;}
.hero-scrolled .hero-ctas{pointer-events:none;}
.scroll-hint{display:none;}
.scroll-hint .wheel{
  width:24px;height:40px;border:2px solid var(--ink);border-radius:14px;position:relative;
}
.scroll-hint .wheel::after{
  content:"";position:absolute;top:7px;left:50%;margin-left:-2px;
  width:4px;height:8px;border-radius:4px;background:var(--red);
  animation:wheel 1.6s ease-in-out infinite;
}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(14px);opacity:0}100%{opacity:0}}
/* ---------- WHITE LANDING with cursor-spotlight reveal ---------- */
.intro{
  position:absolute;inset:0;z-index:5;
  background:#ffffff;
  display:flex;flex-direction:column;
  overflow:hidden;
  opacity:0;visibility:hidden;   /* the page opens on the dna; JS fades this in */
}
/* hidden UI collage — visible only inside the spotlight around the cursor */
.reveal-layer{
  position:absolute;inset:0;pointer-events:none;display:none;
  z-index:0;                       /* must stay behind the text and the tablet */
  background-image:url('assets/reveal.jpg');
  background-size:cover;background-position:center top;
  opacity:.5;
  -webkit-mask-image:radial-gradient(circle 230px at var(--mx,-500px) var(--my,-500px),
    #000 0%, rgba(0,0,0,.85) 45%, transparent 72%);
          mask-image:radial-gradient(circle 230px at var(--mx,-500px) var(--my,-500px),
    #000 0%, rgba(0,0,0,.85) 45%, transparent 72%);
  /* without these the gradient tiles and stray copies of the spotlight
     appear away from the cursor */
  -webkit-mask-repeat:no-repeat;  mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;    mask-size:100% 100%;
}
@media (hover:hover) and (pointer:fine){
  .reveal-layer{display:block;}
}
.intro-inner{
  width:100%;max-width:1280px;margin:0 auto;
  padding:calc(var(--nav-h) + clamp(26px,6vh,68px)) clamp(22px,5vw,64px) 0;
  will-change:transform;
  position:relative;z-index:2;      /* above the reveal layer */
}
.intro-title{
  color:var(--ink);font-weight:800;letter-spacing:-.04em;line-height:1.03;
  font-size:clamp(40px,5.8vw,92px);max-width:15ch;
  position:relative;z-index:2;
}
.intro-title .red{color:var(--red);}
.intro-sub{
  margin-top:24px;color:var(--grey);font-weight:400;
  font-size:clamp(15px,1.3vw,18px);line-height:1.55;max-width:52ch;
}
.intro-ctas{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;}
.lbl-sm{display:none;}   /* short button labels, swapped in on mobile */

/* premium staggered entrance: headline → subhead → CTAs → the app.
   Gated behind .armed so it plays when the hero arrives mid-scroll (and
   replays if the visitor scrolls back up). Children animate, never
   .intro-inner or .app-frame's transform — the scroll zoom drives those. */
/* everything sweeps in from the RIGHT, staggered: title → sub → CTAs → the app.
   The slide lives on .app-shot (the image), never on .app-frame — the scroll
   zoom writes .app-frame's transform inline every frame and a CSS animation
   there would override the dive. */
@keyframes heroSlide{
  from{opacity:0;transform:translateX(clamp(40px,5vw,80px));}
  to{opacity:1;transform:translateX(0);}
}
@keyframes shotSlide{
  from{opacity:0;transform:translateX(clamp(70px,9vw,140px));}
  to{opacity:1;transform:translateX(0);}
}
@keyframes heroFade{ from{opacity:0;} to{opacity:1;} }
.intro-title,.intro-sub,.intro-ctas,.app-shot{opacity:0;}
.intro.armed .intro-title,.intro.armed .intro-sub,.intro.armed .intro-ctas{
  animation:heroSlide .8s cubic-bezier(.22,.9,.26,1) forwards;
}
.intro.armed .intro-title{animation-delay:.05s;}
.intro.armed .intro-sub  {animation-delay:.22s;}
.intro.armed .intro-ctas {animation-delay:.38s;}
.intro.armed .app-shot{
  animation:shotSlide .9s cubic-bezier(.22,.9,.26,1) .3s forwards;
}
@media (prefers-reduced-motion:reduce){
  .intro-title,.intro-sub,.intro-ctas,.app-shot,
  .intro.armed .intro-title,.intro.armed .intro-sub,.intro.armed .intro-ctas,.intro.armed .app-shot{
    animation:none;opacity:1;
  }
}
.app-frame{
  flex:1;min-height:0;
  width:min(1180px,94vw);
  margin:clamp(16px,4vh,44px) auto 0;
  will-change:transform;transform-origin:50% 12%;
  position:relative;z-index:1;      /* the collage must never paint over the tablet */
  overflow:hidden;                  /* the shot's slide-in stays masked inside the frame */
  /* box-shadow on the container instead of a filter on the PNG:
     filters re-rasterise every frame of the zoom and caused visible jank */
  border-radius:22px;
  box-shadow:0 34px 80px rgba(17,17,20,.26);
}
.app-shot{
  display:block;width:100%;height:auto;
}
#vidStack{will-change:transform;}
/* white blow-out at the deepest point of the microscope zoom */
.zoom-flash{
  position:absolute;inset:0;z-index:6;
  background:#fff;opacity:0;pointer-events:none;
}

/* ---------- MID-JOURNEY STATEMENT ---------- */
.mid-note{
  position:absolute;inset:0;z-index:3;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--nav-h) + 20px) 7vw 60px;
  opacity:0;pointer-events:none;
  will-change:opacity,transform;
}

.mid-inner{position:relative;text-align:center;max-width:900px;}
/* side block on entry: brand above the 31-years statement, over the raw video */
.side-note{
  position:absolute;inset:0;z-index:3;
  display:flex;align-items:center;
  padding:calc(var(--nav-h) + 10px) 7vw 40px;
  opacity:0;pointer-events:none;will-change:opacity;
}
/* deep-red wash behind the words: covers the left half, dissolves into the
   strand on the right — the copy sits on it in white */
.side-red{
  position:absolute;inset:0;
  background:linear-gradient(100deg,
    #a80d20 0%,
    rgba(184,14,35,.96) 30%,
    rgba(205,17,40,.62) 48%,
    rgba(237,27,52,0) 68%);
  opacity:0;will-change:opacity;
}
.side-inner{position:relative;max-width:560px;}
.side-note h2{
  font-size:clamp(28px,3.6vw,52px);font-weight:700;line-height:1.12;
  letter-spacing:-.035em;color:#fff;
}
.side-note .w{opacity:0;will-change:opacity;}
.mid-brand{
  display:flex;flex-direction:column;align-items:flex-start;line-height:1;
  margin-bottom:clamp(16px,3vh,26px);
  opacity:0;will-change:opacity;   /* appears with the red wash */
}
.mid-brand img{height:clamp(56px,7vw,88px);width:auto;display:block;}
/* the nav logo yields while the big lockup is centre stage */
nav .logo{transition:opacity .4s ease;}
body.brand-center nav .logo{opacity:0;pointer-events:none;}
.mid-eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  color:#fff;font-weight:600;font-size:12.5px;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:22px;
}
.mid-eyebrow::before,.mid-eyebrow::after{content:"";width:26px;height:2px;background:rgba(255,255,255,.75);}
.mid-note h2{
  font-size:clamp(28px,4.2vw,60px);font-weight:700;line-height:1.12;
  letter-spacing:-.035em;color:var(--ink);max-width:24ch;margin:0 auto;
}
.mid-note p{
  margin:22px auto 0;max-width:60ch;
  font-size:clamp(14.5px,1.25vw,17px);line-height:1.62;color:var(--grey);
}
/* scroll-driven word-by-word reveal — pure fade, no movement */
.mid-note .w{opacity:0;will-change:opacity;}
@media (max-width:820px){
  .mid-note h2 br{display:none;}
}

/* ---------- HORIZONTAL TRACK ---------- */
/* panels are stacked and cross-fade in place — no horizontal travel */
.h-track{
  position:absolute;inset:0;z-index:2;
}
/* DNA helix ribbon — hidden */
.h-track::before{display:none;}
.panel{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--nav-h) + 52px) 7vw 46px;  /* clears the feature strip */
  pointer-events:none;              /* only the panel on stage is clickable */
}
.panel.show{pointer-events:auto;}
.panel.bye{pointer-events:none;}
/* ---- feature strip: page indicator riding under the header while the
       visitor moves through the service pages; click a name to fly there ---- */
.feat-strip{
  position:fixed;top:var(--nav-h);left:0;right:0;z-index:90;
  display:flex;align-items:center;gap:5px;
  padding:4px 18px 10px;
  opacity:0;pointer-events:none;transform:translateY(-8px);
  transition:opacity .45s ease,transform .45s ease;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.feat-strip::-webkit-scrollbar{display:none;}
/* auto margins centre the row when it fits, and let it scroll when it doesn't */
.feat-strip > :first-child{margin-left:auto;}
.feat-strip > :last-child{margin-right:auto;}
body.strip-on .feat-strip{opacity:1;pointer-events:auto;transform:none;}
.feat-strip .fdot{flex:0 0 auto;width:3px;height:3px;border-radius:50%;background:rgba(17,17,20,.22);}
.feat-strip button{
  flex:0 0 auto;appearance:none;border:0;background:none;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:rgba(17,17,20,.45);padding:4px 10px;border-radius:999px;
  transition:color .25s,background .25s;white-space:nowrap;
}
.feat-strip button:hover{color:var(--ink);}
.feat-strip button.on{color:#fff;background:var(--red);}
@media (max-width:900px){
  .feat-strip{padding:2px 12px 8px;}
  .feat-strip button{font-size:10.5px;padding:3px 7px;}
}

/* first service: text directly over the video's end scene, no card */
.panel-first{background:transparent;}
/* the constant .page-veil already sits over the strand — panels add nothing */
/* Linear-style split: eyebrow across the top, headline left, copy right */
.panel-first .panel-inner{
  display:grid;
  grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);
  column-gap:clamp(26px,4.6vw,74px);row-gap:0;
  align-items:start;
  width:100%;max-width:1240px;margin:0 auto;
  position:relative;z-index:2;
}
/* side-scroll entrance: the words sweep in from the right, leave to the left,
   in three staggered waves — eyebrow, headline, then the copy */
.panel-first .p-tag,
.panel-first .p-head,
.panel-first .p-body{
  opacity:0;transform:translateX(clamp(60px,7vw,110px));
  transition:opacity .6s cubic-bezier(.22,.9,.26,1),transform .6s cubic-bezier(.22,.9,.26,1);
}
.panel-first.show .p-tag,
.panel-first.show .p-head,
.panel-first.show .p-body{opacity:1;transform:translateX(0);}
.panel-first.show .p-tag {transition-delay:0s;}
.panel-first.show .p-head{transition-delay:.08s;}
.panel-first.show .p-body{transition-delay:.16s;}
.panel-first.bye .p-tag,
.panel-first.bye .p-head,
.panel-first.bye .p-body{opacity:0;transform:translateX(clamp(-110px,-7vw,-60px));}
.panel-first.bye .p-tag {transition-delay:0s;}
.panel-first.bye .p-head{transition-delay:.04s;}
.panel-first.bye .p-body{transition-delay:.08s;}
.panel-first .p-tag{grid-column:1/-1;}
.panel-first .p-body{padding-top:clamp(3px,.7vw,10px);}
.panel-first .panel-num{display:none;}
/* the feature checklist sits under the headline, compact so a full page fits */
.p-list{
  list-style:none;margin-top:clamp(16px,2vh,26px);
  display:flex;flex-direction:column;gap:clamp(6px,.9vh,10px);
}
.p-list.cols{
  display:grid;grid-template-columns:1fr 1fr;
  column-gap:clamp(14px,1.6vw,26px);row-gap:clamp(5px,.8vh,9px);
}
/* wide centred pages fit the full list in three compact columns */
.p-list.cols3{
  display:grid;grid-template-columns:repeat(3,1fr);
  column-gap:clamp(14px,1.8vw,30px);row-gap:clamp(4px,.7vh,8px);
  text-align:left;margin-top:clamp(14px,2vh,22px);
}
.p-list.cols3 li{font-size:clamp(11px,.85vw,12.5px);line-height:1.4;}
.p-list.cols3 .clip{flex:0 0 13px;margin-top:1px;}
.p-list.cols3 .clip svg{width:13px;height:13px;}
.p-list li{
  display:flex;gap:9px;align-items:flex-start;
  font-size:clamp(11.5px,.95vw,13.5px);line-height:1.45;color:#2b2b31;font-weight:400;
}
.p-list .clip{flex:0 0 14px;margin-top:1px;}
.p-list .clip svg{width:14px;height:14px;}
.panel-first .p-sub{margin-top:0;max-width:42ch;font-size:clamp(15px,1.35vw,18px);}
.p-note{margin-top:14px;max-width:42ch;font-size:12.5px;line-height:1.55;color:#8a8a92;}
/* benefit card: screenshot (or branded placeholder) + huly-style caption */
.p-feature{
  margin-top:18px;max-width:470px;
  border-radius:16px;overflow:hidden;
  background:#fff;border:1px solid rgba(17,17,20,.08);
  box-shadow:0 18px 44px rgba(17,17,20,.10);
}
.p-shot{aspect-ratio:16/9;overflow:hidden;background:#f6f5f4;}
.p-shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;}
.ph{
  width:100%;height:100%;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:
    radial-gradient(rgba(17,17,20,.05) 1px, transparent 1.4px),
    linear-gradient(135deg,#fafafa 0%,#f1efee 55%,#f7ecec 100%);
  background-size:18px 18px, auto;
}
.ph-num{
  font-size:44px;font-weight:800;line-height:1;
  color:transparent;-webkit-text-stroke:1.6px rgba(237,27,52,.35);
}
.ph-tag{
  font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(17,17,20,.35);
}
.p-benefit{
  padding:13px 16px 14px;
  font-size:13.5px;line-height:1.5;color:var(--grey);
}
.p-benefit b{color:var(--ink);font-weight:700;}
/* screenshot cards: caption sits ON the image over a white fade (huly card style) */
.p-feature.has-shot{position:relative;}
.p-feature.has-shot .p-shot{aspect-ratio:16/10;}
.p-feature.has-shot .p-benefit{
  position:absolute;left:0;right:0;bottom:0;
  padding:44px 16px 13px;
  background:linear-gradient(180deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.82) 40%,
    rgba(255,255,255,.97) 100%);
}
.panel-first .p-cta .btn-red{
  background:none;box-shadow:none;color:var(--red);
  padding:0;border-radius:0;font-size:15px;font-weight:600;letter-spacing:-.01em;gap:6px;
}
.panel-first .p-cta .btn-red::before{content:"›";font-size:22px;line-height:1;font-weight:900;}
.panel-first .p-cta .btn-red:hover{transform:translateX(4px);background:none;}
.panel-first .p-cta{display:flex;align-items:center;gap:clamp(18px,2.4vw,34px);flex-wrap:wrap;}
.p-cta .cta2{
  color:var(--grey);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:-.01em;
  border-bottom:1px solid rgba(17,17,20,.18);padding-bottom:1px;transition:color .2s,border-color .2s;
}
.p-cta .cta2:hover{color:var(--ink);border-color:var(--red);}
.panel-inner{
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  gap:6vw;align-items:center;width:100%;max-width:1280px;
}
.panel-num{
  position:absolute;top:calc(var(--nav-h) + 8px);right:6vw;
  font-size:clamp(90px,16vw,220px);font-weight:900;line-height:1;
  color:transparent;-webkit-text-stroke:2px rgba(237,27,52,.22);
  user-select:none;pointer-events:none;
}
/* huly-style gradient icon tile above each service title */
.p-icon{
  width:46px;height:46px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#ff4b60 0%,var(--red) 55%,var(--red-dark) 100%);
  box-shadow:0 8px 22px rgba(237,27,52,.32), inset 0 1px 0 rgba(255,255,255,.28);
  margin-bottom:16px;
}
.p-icon svg{width:24px;height:24px;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.p-tag{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--red);font-weight:600;font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:16px;
}
.p-tag::before{content:"";width:24px;height:2px;background:var(--red);}
.p-title{
  font-size:clamp(27px,3vw,46px);font-weight:700;line-height:1.1;letter-spacing:-.028em;
}
.p-cn{margin-top:12px;color:var(--red);font-weight:600;font-size:clamp(14px,1.35vw,18px);letter-spacing:.2em;}
.p-sub{margin-top:16px;color:var(--grey);font-size:clamp(14px,1.2vw,16.5px);line-height:1.6;max-width:48ch;font-weight:400;}
.p-cta{margin-top:28px;}
.p-card{
  background:var(--white);border-radius:24px;
  box-shadow:0 24px 60px rgba(17,17,20,.09);
  padding:clamp(22px,2.6vw,40px);
  border-top:5px solid var(--red);
}
.p-card ul{list-style:none;display:flex;flex-direction:column;gap:14px;}
.p-card li{
  display:flex;gap:12px;align-items:flex-start;
  font-size:clamp(13px,1.1vw,15px);line-height:1.55;color:#2b2b31;font-weight:400;
}
.clip{
  flex:0 0 18px;margin-top:1px;
}
.clip svg{display:block;width:18px;height:18px;}

/* ============ SERVICE LAYOUT VARIANTS (mix so pages don't repeat) ============ */

/* concept 1 — lay-center: centred statement, app on stage below */
.lay-center .panel-inner{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:0;max-width:1100px;
}
.lay-center .p-tag::before{display:none;}
.lay-center .p-tag{margin-bottom:10px;}
.lay-center .p-title{font-size:clamp(28px,3.4vw,50px);}
.lay-center .p-sub{margin:12px auto 0;max-width:56ch;}
.pill-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:13px;}
.pill{
  display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;
  background:#fff;box-shadow:0 4px 16px rgba(17,17,20,.09);
  font-size:12.5px;font-weight:600;color:#2b2b31;
}
.pill i{width:8px;height:8px;border-radius:50%;}
.lay-center .p-cta{margin-top:16px;justify-content:center;}
.lay-center .p-body{margin-top:clamp(14px,2.4vh,24px);width:100%;}
/* dense half: the full bullet list beside the screenshot */
.c-row{
  display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  gap:clamp(20px,2.6vw,40px);align-items:center;text-align:left;
}
.p-list.c-side{margin-top:0;display:flex;flex-direction:column;gap:clamp(5px,.8vh,9px);}
.p-list.c-side li{font-size:clamp(11.5px,.92vw,13px);line-height:1.45;}
.p-list.c-side .clip{flex:0 0 14px;margin-top:1px;}
.p-list.c-side .clip svg{width:14px;height:14px;}
.lay-center .p-note{margin:10px auto 0;text-align:center;max-width:78ch;font-size:11.5px;}
/* pages carrying a legal note give the screenshot a little back */
.lay-center.has-note .c-shot img{max-height:30vh;}
.c-shot{
  max-width:min(860px,94%);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 70px rgba(17,17,20,.18);background:#fff;
}
.c-shot img{display:block;width:100%;max-height:36vh;object-fit:cover;object-position:center top;}
/* tablet-mockup shots carry their own frame — no card chrome around them */
.c-shot.tab{background:none;box-shadow:none;border-radius:0;overflow:visible;}
.c-shot.tab img{width:auto;max-width:100%;max-height:50vh;object-fit:contain;margin:0 auto;
  filter:drop-shadow(0 24px 48px rgba(17,17,20,.22));}
.f-shot.tab{background:none;box-shadow:none;border-radius:0;overflow:visible;}
.f-shot.tab img{filter:drop-shadow(0 24px 48px rgba(17,17,20,.22));}

/* concept 2 — lay-float: tilted app shot with floating status cards */
.lay-float .panel-inner{align-items:center;}
.lay-float .p-tag{margin-bottom:12px;}
.lay-float .p-sub{margin-top:12px;}
.f-wrap{position:relative;max-width:560px;margin-left:auto;}
.f-shot{
  border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 34px 80px rgba(17,17,20,.18);
  transform:perspective(1400px) rotateY(-7deg) rotateX(1.5deg);
}
.f-shot img{display:block;width:100%;}
.f-stat{
  position:absolute;top:-26px;right:-14px;z-index:2;
  background:linear-gradient(135deg,#ff4b60 0%,var(--red) 55%,var(--red-dark) 100%);
  color:#fff;border-radius:14px;padding:12px 18px;
  box-shadow:0 16px 38px rgba(237,27,52,.35);
  animation:bob 4.5s ease-in-out infinite alternate;
}
.f-stat span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
.f-stat b{display:block;font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.01em;}
.f-toast{
  position:absolute;bottom:-26px;left:-22px;z-index:2;
  background:#fff;border-radius:14px;padding:12px 16px;
  display:flex;align-items:center;gap:11px;
  box-shadow:0 18px 44px rgba(17,17,20,.17);
  animation:bob 5.5s ease-in-out infinite alternate-reverse;
}
.f-check{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--red);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(237,27,52,.35);
}
.f-check svg{width:14px;height:14px;}
.f-toast span{display:block;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9a9aa2;}
.f-toast b{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-top:1px;}
.f-toast i{display:block;font-style:normal;font-size:10.5px;color:#b3b3ba;margin-top:1px;}
@keyframes bob{from{transform:translateY(0);}to{transform:translateY(-9px);}}
/* secondary heading blocks from the write-up */
.p-extra{margin-top:clamp(10px,1.6vh,17px);}
.p-extra h3{
  font-size:clamp(15px,1.35vw,18px);font-weight:700;letter-spacing:-.02em;color:var(--ink);
}
.p-extra p{
  margin-top:5px;color:var(--grey);font-size:clamp(12.5px,1.05vw,14.5px);
  line-height:1.6;font-weight:400;max-width:58ch;
}
.lay-center .p-extra p{margin-left:auto;margin-right:auto;}
.p-list.mini{margin-top:16px;gap:7px;}
.p-list.mini li{font-size:clamp(12px,.95vw,13.5px);}

/* concept 3 — lay-edit: editorial ghost number + vertical label + status list */
.lay-edit .panel-inner{align-items:center;}
.lay-edit .p-tag{display:none;}
.ed-side{
  position:absolute;left:2.4vw;top:50%;z-index:2;
  transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;
  color:var(--red);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  padding-top:46px;
}
.ed-side::before{
  content:"";position:absolute;top:0;left:50%;width:1.5px;height:36px;background:var(--red);
}
.ed-num{
  position:absolute;left:3.5vw;top:calc(var(--nav-h) + 8px);z-index:1;
  font-size:clamp(150px,20vw,280px);font-weight:900;line-height:1;
  color:transparent;-webkit-text-stroke:2px rgba(17,17,20,.07);
  user-select:none;pointer-events:none;
}
.lay-edit .ed-side,.lay-edit .ed-num{opacity:0;transition:opacity .6s ease .2s;}
.lay-edit.show .ed-side,.lay-edit.show .ed-num{opacity:1;}
.lay-edit.bye .ed-side,.lay-edit.bye .ed-num{opacity:0;transition-delay:0s;}
.lay-edit .p-cta .btn-red{
  background:#fff;border:1.5px solid var(--red);color:var(--red);
  padding:11px 20px;border-radius:10px;font-size:14px;box-shadow:none;
}
.lay-edit .p-cta .btn-red::before{content:none;}
.lay-edit .p-cta .btn-red:hover{background:var(--red);color:#fff;transform:none;}
.ed-list{margin-top:clamp(18px,3vh,28px);max-width:360px;}
.ed-row{
  display:flex;align-items:center;gap:11px;
  padding:10px 2px;border-bottom:1px solid rgba(17,17,20,.08);
  font-size:13.5px;color:var(--ink);
}
.ed-row i{flex:0 0 8px;height:8px;border-radius:50%;}
.ed-row span{font-weight:600;}
.ed-row b{margin-left:auto;font-weight:500;color:var(--grey);}
.ed-row em{font-style:normal;color:#c2c2c8;font-weight:700;}
.ed-shot{max-width:100%;}
.ed-cap{margin-top:11px;text-align:right;font-size:12px;color:#9a9aa2;}

@media (max-width:900px){
  .f-wrap{margin:26px auto 30px;max-width:92%;}
  .f-shot{transform:none;}
  .f-stat{top:-18px;right:-4px;padding:9px 13px;}
  .f-stat b{font-size:16px;}
  .f-toast{bottom:-18px;left:-4px;padding:9px 12px;}
  .ed-side,.ed-num{display:none;}
  .ed-cap{text-align:center;}
  .c-shot img{max-height:38vh;}
  .lay-center .p-body{margin-bottom:8px;}
}

/* ------ breather pages (Partners / About): a SOLID white sheet sweeps in
        from the right, then the content slides on after it ------ */
.panel-break{background:transparent;}
.panel-break::before{
  content:"";position:absolute;inset:0;background:#fff;
  transform:translateX(102%);
  transition:transform .7s cubic-bezier(.22,.9,.26,1);
}
.panel-break.show::before{transform:translateX(0);}
.panel-break.bye::before{transform:translateX(-102%);}
.break-inner{
  position:relative;z-index:2;width:100%;max-width:980px;margin:0 auto;text-align:center;
}
.panel-break .p-tag{margin-bottom:6px;}
.panel-break .p-tag::before{display:none;}   /* centred eyebrow, no rule */
.b-title{font-size:clamp(26px,3vw,44px);font-weight:700;line-height:1.1;letter-spacing:-.028em;margin-top:6px;}
.b-sub{margin:14px auto 0;max-width:56ch;color:var(--grey);font-size:clamp(14px,1.2vw,16.5px);line-height:1.65;font-weight:400;}
.logo-row{
  margin-bottom:clamp(26px,4.5vh,44px);
  display:flex;justify-content:center;gap:clamp(14px,2vw,24px);flex-wrap:wrap;
}
.logo-ph{
  width:clamp(140px,16vw,220px);aspect-ratio:16/7;border-radius:16px;
  border:1.5px dashed rgba(17,17,20,.16);background:#fafafa;
  display:flex;align-items:center;justify-content:center;
}
.logo-ph span{
  color:rgba(17,17,20,.32);font-size:11.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
}
/* endless logo marquee: the client-company logos drift by, edges feathered */
.marq{
  width:100%;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
}
.marq-track{
  display:flex;align-items:center;width:max-content;
  animation:marq 44s linear infinite;will-change:transform;
}
.marq-track img{
  height:clamp(30px,4vw,46px);width:auto;display:block;
  margin-right:clamp(36px,5vw,68px);
}
@keyframes marq{to{transform:translateX(-50%);}}
.stat-row{
  margin-top:clamp(26px,4.5vh,44px);
  display:flex;justify-content:center;gap:clamp(30px,5.5vw,80px);flex-wrap:wrap;
}
.stat-row b{display:block;font-size:clamp(34px,4vw,56px);font-weight:800;letter-spacing:-.03em;color:var(--red);line-height:1;}
.stat-row span{display:block;margin-top:8px;font-size:12.5px;color:var(--grey);letter-spacing:.03em;}
/* content waves: slide in from the right once the sheet has landed,
   leave to the left with it */
.panel-break .p-tag,.panel-break .b-title,.panel-break .b-sub,
.panel-break .logo-row,.panel-break .stat-row{
  opacity:0;transform:translateX(clamp(60px,7vw,110px));
  transition:opacity .6s cubic-bezier(.22,.9,.26,1),transform .6s cubic-bezier(.22,.9,.26,1);
}
.panel-break.show .p-tag,.panel-break.show .b-title,.panel-break.show .b-sub,
.panel-break.show .logo-row,.panel-break.show .stat-row{opacity:1;transform:translateX(0);}
.panel-break.show .p-tag  {transition-delay:.30s;}
.panel-break.show .b-title{transition-delay:.38s;}
.panel-break.show .b-sub  {transition-delay:.46s;}
.panel-break.show .stat-row{transition-delay:.56s;}
/* on the Partners page the logos come out FIRST, the words follow */
.break-logos.show .logo-row{transition-delay:.28s;}
.break-logos.show .p-tag  {transition-delay:.52s;}
.break-logos.show .b-title{transition-delay:.60s;}
.break-logos.show .b-sub  {transition-delay:.68s;}
.panel-break.bye .p-tag,.panel-break.bye .b-title,.panel-break.bye .b-sub,
.panel-break.bye .logo-row,.panel-break.bye .stat-row{
  opacity:0;transform:translateX(clamp(-110px,-7vw,-60px));
  transition-delay:0s;
}
/* Partners → About is a cross-FADE (user request): Partners leaves by fading
   out in place, About arrives by fading in — no sideways slide between them */
.break-logos::before{
  transition:transform .7s cubic-bezier(.22,.9,.26,1),opacity .6s ease;
}
.break-logos.bye::before{transform:translateX(0);opacity:0;}
.break-logos.bye .p-tag,.break-logos.bye .b-title,.break-logos.bye .b-sub,
.break-logos.bye .logo-row{transform:none;}
.break-about::before{
  transform:none;opacity:0;
  transition:opacity .7s ease;
}
.break-about.show::before{opacity:1;}
.break-about.bye::before{
  opacity:1;transform:translateX(-102%);
  transition:transform .7s cubic-bezier(.22,.9,.26,1);
}
.break-about .p-tag,.break-about .b-title,.break-about .b-sub,
.break-about .stat-row{transform:none;}
.break-about.bye .p-tag,.break-about.bye .b-title,.break-about.bye .b-sub,
.break-about.bye .stat-row{transform:translateX(clamp(-110px,-7vw,-60px));}

/* ------ final CTA / contact panel: pops over the closing scene ------ */
.panel-contact{flex:0 0 100vw;background:transparent;}
.panel-contact::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left, rgba(255,255,255,.97) 0%, rgba(255,255,255,.92) 45%, rgba(255,255,255,.78) 100%);
  opacity:0;transition:opacity .8s ease;
}
.panel-contact.show::before{opacity:1;}
.panel-contact .contact-inner{
  position:relative;z-index:2;
  opacity:0;transform:translateY(50px);
  transition:opacity .8s cubic-bezier(.22,.9,.26,1),transform .8s cubic-bezier(.22,.9,.26,1);
}
.panel-contact .foot-note{z-index:2;opacity:0;transition:opacity .8s ease;}
.panel-contact.show .contact-inner{opacity:1;transform:translateY(0);}
.panel-contact.show .foot-note{opacity:1;}
.contact-inner{
  width:100%;max-width:1280px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:5vw;align-items:center;
}
.contact-info h2{font-size:clamp(27px,3vw,42px);font-weight:700;line-height:1.1;letter-spacing:-.028em;}
.contact-info h2 .red{color:var(--red);}
.contact-info p.lead{margin-top:16px;color:var(--grey);line-height:1.6;font-size:clamp(14px,1.2vw,16.5px);max-width:50ch;font-weight:400;}
.contact-list{margin-top:26px;display:flex;flex-direction:column;gap:12px;}
.contact-list a,.contact-list span{
  display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;
  font-size:14.5px;font-weight:500;
}
.contact-list a:hover{color:var(--red);}
.ci{
  flex:0 0 34px;height:34px;border-radius:50%;background:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;
}
.ci svg{width:16px;height:16px;fill:#fff;}
.founder{margin-top:26px;padding-top:20px;border-top:1px solid rgba(17,17,20,.1);font-size:14px;color:var(--grey);}
.founder b{color:var(--ink);font-size:16px;}
.lead-card{
  background:var(--white);border-radius:24px;box-shadow:0 24px 60px rgba(17,17,20,.10);
  padding:clamp(24px,2.6vw,40px);border-top:5px solid var(--red);
}
.lead-card h3{font-size:clamp(18px,1.7vw,22px);font-weight:700;letter-spacing:-.02em;}
.lead-card p{margin-top:8px;color:var(--grey);font-size:14px;line-height:1.55;font-weight:400;}
.lead-form{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.lead-form input,.lead-form select,.lead-form textarea{
  width:100%;padding:11px 14px;border-radius:9px;border:1px solid rgba(17,17,20,.14);
  font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.lead-form input:focus,.lead-form select:focus,.lead-form textarea:focus{
  border-color:var(--red);box-shadow:0 0 0 3px rgba(237,27,52,.10);
}
.lead-form .full{grid-column:1/-1;}

    /* reversed segments scrub backwards, and park on the opposite ends */
    if      (j === k) driveScrub(s, s.rev ? 1 - p : p);
    else if (j < k)   driveScrub(s, s.rev ? 0 : 1);
    else              driveScrub(s, s.rev ? 1 : 0);
    s.v.style.opacity = Math.min(1, Math.max(0, (u - startOfSeg(j)) / 0.35));
  });

  /* entry side block: brand + 31 years fade up as the auto-playing video
     nears its end, then leave as the white sweep carries the visitor away */
  {
    const v0 = scrubs[0].v;
    const dur = v0.duration || 4;
    const vp = Math.min(1, v0.currentTime / (dur * 0.92));
    const reveal = u < 0.4 ? Math.max(0, Math.min(1, (vp - 0.4) / 0.45)) : 1;
    const out = 1 - Math.max(0, Math.min(1, (u - 0.45) / 0.6));
    midWords.style.opacity = out.toFixed(3);
    sideRed.style.opacity = Math.min(1, reveal * 1.6).toFixed(3);
    midBrand.style.opacity = Math.min(1, reveal * 2).toFixed(3);
    midEyebrow.style.opacity = Math.min(1, reveal * 3).toFixed(3);
    const N = noteWords.length;
    for (let i = 0; i < N; i++){
      noteWords[i].style.opacity = Math.max(0, Math.min(1, reveal * (N + 2) - i)).toFixed(3);
    }
    document.body.classList.toggle('brand-center', u < 1.0);
  }

  /* the veil fades in over the dive so the first service reads on white */
  pageVeil.style.opacity = Math.max(0, Math.min(1, (u - 1.4) / 0.9)).toFixed(3);

  /* each panel pops on its scene's end frame, then fades off into the next scene */
  panels.forEach((el, i)=>{
    const stop = unitsForPanel(i);
    el.classList.toggle('show', u > stop - SEG * 0.3);
    el.classList.toggle('bye',  u > stop + 0.45);
  });

  /* feature strip: rides under the header through the service pages and
     highlights the page in view; hidden on the entry, hero and dive */
  document.body.classList.toggle('strip-on', u > BASE + SEG - 0.6);
  {
    const act = Math.max(0, Math.min(PANEL_COUNT - 1, Math.round((u - BASE) / SEG) - 1));
    if (act !== stripIdx){
      stripIdx = act;
      featBtns.forEach((b, i)=>b.classList.toggle('on', i === act));
      const b = featBtns[act];
      if (featStrip.scrollWidth > featStrip.clientWidth + 4){
        featStrip.scrollTo({left: b.offsetLeft - featStrip.clientWidth/2 + b.offsetWidth/2, behavior:'smooth'});
      }
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* (idle snapping removed — the pager owns navigation now) */

let lastVH = window.innerHeight;
window.addEventListener('resize', ()=>{
  const u = (window.scrollY - jWrap.offsetTop) / lastVH;
  lastVH = window.innerHeight;
  sizeWrap();
  window.scrollTo({top: jWrap.offsetTop + u * lastVH, behavior:'auto'});
});
