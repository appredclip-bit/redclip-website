<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | REDclip 小红夹</title>
<meta name="description" content="Log in to REDclip: client and agent portals.">
<link rel="icon" type="image/png" href="assets/brand-icon.png">
<link rel="apple-touch-icon" href="assets/brand-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ED1B34;
  --red-dark:#C8102E;
  --ink:#111114;
  --grey:#6b6f76;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","cv11";
  background:#ffffff;
  color:var(--ink);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px;
}
/* soft brand wash at the top of the page */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(90% 55% at 50% -18%, rgba(237,27,52,.10) 0%, rgba(237,27,52,.04) 45%, rgba(237,27,52,0) 70%);
}
::selection{background:var(--red);color:#fff;}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:880px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.lockup{height:74px;width:auto;display:block;margin-bottom:30px;}
h1{font-size:27px;font-weight:700;letter-spacing:-.03em;}
.sub{margin-top:9px;color:var(--grey);font-size:14.5px;line-height:1.55;}

/* client on the left, agent on the right */
.choices{
  margin-top:38px;width:100%;
  display:grid;grid-template-columns:1fr 1fr;gap:22px;
}
.portal{
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
  padding:40px 28px 34px;border-radius:20px;text-decoration:none;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
}
.portal b{display:block;font-size:23px;font-weight:700;letter-spacing:-.02em;}
.portal span{display:block;margin-top:5px;font-size:14px;font-weight:500;opacity:.75;}
.portal .arrow{font-size:26px;font-weight:700;line-height:1;opacity:.75;transition:transform .18s ease;}
.portal:hover .arrow{transform:translateX(5px);}
.p-ic{
  flex:0 0 62px;width:62px;height:62px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
}
.p-ic svg{width:30px;height:30px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
@media (max-width:700px){
  .choices{grid-template-columns:1fr;gap:16px;}
  .portal{padding:28px 22px 24px;}
  .portal b{font-size:20px;}
}

.portal.client{
  background:linear-gradient(135deg,#ff4b60 0%,var(--red) 55%,var(--red-dark) 100%);
  color:#fff;box-shadow:0 14px 34px rgba(237,27,52,.30);
}
.portal.client .p-ic{background:rgba(255,255,255,.16);}
.portal.client .p-ic svg{stroke:#fff;}
.portal.client:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(237,27,52,.38);}

.portal.agent{
  background:#fff;color:var(--ink);
  border:1.5px solid rgba(17,17,20,.14);
  box-shadow:0 10px 28px rgba(17,17,20,.07);
}
.portal.agent .p-ic{background:#f4f3f2;}
.portal.agent .p-ic svg{stroke:var(--ink);}
.portal.agent:hover{transform:translateY(-2px);border-color:var(--red);box-shadow:0 16px 38px rgba(17,17,20,.11);}
.portal.agent:hover b{color:var(--red);}

.back{
  margin-top:30px;text-decoration:none;color:var(--grey);
  font-size:13.5px;font-weight:500;transition:color .25s ease;
}
.back:hover{color:var(--red);}

.foot{
  position:relative;z-index:1;margin-top:44px;
  font-size:11.5px;color:rgba(17,17,20,.4);text-align:center;
}
</style>
</head>
<body>

<main class="wrap">
  <img class="lockup" src="assets/brand-lockup.png" alt="REDclip 小红夹">
  <h1>Log in</h1>
  <p class="sub">Choose your portal to continue.</p>

  <div class="choices">
    <a class="portal client" href="https://app.redclip.com">
      <span class="p-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="3.4"/><path d="M5.5 20c.6-3.6 3.2-5.7 6.5-5.7s5.9 2.1 6.5 5.7"/></svg></span>
      <span><b>Client Login</b><span>app.redclip.com</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="portal agent" href="https://go.redclip.com">
      <span class="p-ic"><svg viewBox="0 0 24 24"><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7"/><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M3.5 12.5h17"/></svg></span>
      <span><b>Agent Login</b><span>go.redclip.com</span></span>
      <span class="arrow">›</span>
    </a>
    <!-- client left, agent right -->

  </div>

  <a class="back" href="index.html">← Back to redclip.com</a>
</main>

<div class="foot">© REDCLIP PTE. LTD. · 小红夹</div>

</body>
</html>
