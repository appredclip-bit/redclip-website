<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | REDclip 小红夹</title>
<meta name="description" content="Log in to REDclip: client and agent portals.">
<link rel="icon" type="image/png" href="assets/brand-icon.png">
<link rel="apple-touch-icon" href="assets/brand-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ED1B34;
  --red-dark:#C8102E;
  --ink:#111114;
  --grey:#6b6f76;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
html{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","cv11";
  background:#ffffff;color:var(--ink);
  overflow:hidden;
}
::selection{background:var(--red);color:#fff;}

/* ---------- header floating over the split ---------- */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:5;height:84px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,3vw,44px);pointer-events:none;
}
.bar > *{pointer-events:auto;}
.bar img{height:46px;width:auto;display:block;}
.back{
  text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;
  padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.72);
  backdrop-filter:blur(6px);border:1px solid rgba(17,17,20,.10);
  transition:color .25s ease,border-color .25s ease;
}
.back:hover{color:var(--red);border-color:var(--red);}

/* ---------- the two halves ---------- */
.split{display:flex;height:100vh;height:100dvh;width:100%;}
.half{
  flex:1 1 50%;min-width:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(16px,2.4vh,26px);
  padding:clamp(80px,12vh,120px) clamp(24px,4vw,64px);
  text-decoration:none;overflow:hidden;
  transition:flex-basis .45s cubic-bezier(.22,.9,.26,1), background .3s ease;
}
/* the hovered side opens up a little */
.split:hover .half{flex-basis:46%;}
.split .half:hover{flex-basis:54%;}

.half .ic{
  width:clamp(72px,7vw,96px);height:clamp(72px,7vw,96px);border-radius:26px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .35s cubic-bezier(.22,.9,.26,1);
}
.half:hover .ic{transform:translateY(-4px) scale(1.05);}
.half .ic svg{
  width:46%;height:46%;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.half .eyebrow{
  font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
}
.half h2{
  font-size:clamp(30px,4vw,54px);font-weight:800;letter-spacing:-.035em;line-height:1.05;
  text-align:center;
}
.half .url{font-size:clamp(13px,1.15vw,15.5px);font-weight:500;letter-spacing:-.01em;}
.half .go{
  margin-top:clamp(6px,1.4vh,14px);
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 34px;border-radius:999px;
  font-size:clamp(14px,1.15vw,16px);font-weight:700;letter-spacing:-.01em;
  transition:transform .25s cubic-bezier(.22,.9,.26,1),box-shadow .25s ease,background .25s ease,color .25s ease;
}
.half .go i{font-style:normal;font-size:19px;line-height:1;transition:transform .25s ease;}
.half:hover .go i{transform:translateX(4px);}

/* left: client, brand red */
.client{
  background:linear-gradient(150deg,#ff4b60 0%,var(--red) 48%,var(--red-dark) 100%);
  color:#fff;
}
.client .ic{background:rgba(255,255,255,.17);}
.client .ic svg{stroke:#fff;}
.client .eyebrow{color:rgba(255,255,255,.78);}
.client .url{color:rgba(255,255,255,.8);}
.client .go{background:#fff;color:var(--red);box-shadow:0 14px 34px rgba(0,0,0,.16);}
.client:hover .go{transform:translateY(-2px);box-shadow:0 20px 44px rgba(0,0,0,.22);}

/* right: agent, light */
.agent{
  background:#fafafa;color:var(--ink);
  border-left:1px solid rgba(17,17,20,.07);
}
.agent::before{                       /* soft brand wash so it isn't flat */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 60% at 70% 15%, rgba(237,27,52,.10) 0%, rgba(237,27,52,0) 68%);
}
.agent > *{position:relative;}
.agent .ic{background:#fff;box-shadow:0 10px 26px rgba(17,17,20,.09);}
.agent .ic svg{stroke:var(--ink);}
.agent .eyebrow{color:var(--red);}
.agent .url{color:var(--grey);}
.agent .go{
  background:var(--ink);color:#fff;box-shadow:0 14px 34px rgba(17,17,20,.20);
}
.agent:hover .go{transform:translateY(-2px);background:var(--red);box-shadow:0 20px 44px rgba(237,27,52,.30);}

.foot{
  position:fixed;bottom:14px;left:0;right:0;z-index:5;text-align:center;
  font-size:11px;color:rgba(17,17,20,.42);pointer-events:none;
}

/* ---------- phones: stack, each half fills half the screen ---------- */
@media (max-width:820px){
  body{overflow:auto;}
  .split{flex-direction:column;height:auto;min-height:100vh;min-height:100dvh;}
  .half{flex:1 1 50vh;min-height:50vh;padding:clamp(70px,11vh,96px) 24px 40px;gap:14px;}
  .split:hover .half,.split .half:hover{flex-basis:50vh;}
  .agent{border-left:0;border-top:1px solid rgba(17,17,20,.07);}
  .half h2{font-size:clamp(26px,7.5vw,36px);}
  .half .ic{width:64px;height:64px;border-radius:20px;}
  .bar img{height:38px;}
  .foot{display:none;}
}
</style>
</head>
<body>

<header class="bar">
  <a href="index.html" aria-label="REDclip home"><img src="assets/brand-lockup-white.png" alt="REDclip 小红夹"></a>
  <a class="back" href="index.html">← Back to redclip.com</a>
</header>

<main class="split">
  <!-- client on the left -->
  <a class="half client" href="https://app.redclip.com">
    <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6"/><path d="M5 20.5c.7-3.9 3.4-6.1 7-6.1s6.3 2.2 7 6.1"/></svg></span>
    <span class="eyebrow">For clients</span>
    <h2>Client Login</h2>
    <span class="url">app.redclip.com</span>
    <span class="go">Enter client portal <i>›</i></span>
  </a>

  <!-- agent on the right -->
  <a class="half agent" href="https://go.redclip.com">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M8.5 7V5.6A1.6 1.6 0 0 1 10.1 4h3.8a1.6 1.6 0 0 1 1.6 1.6V7"/><rect x="3.2" y="7" width="17.6" height="12.6" rx="2.2"/><path d="M3.2 12.8h17.6"/></svg></span>
    <span class="eyebrow">For agents</span>
    <h2>Agent Login</h2>
    <span class="url">go.redclip.com</span>
    <span class="go">Enter agent portal <i>›</i></span>
  </a>
</main>

<div class="foot">© REDCLIP PTE. LTD. · 小红夹</div>

</body>
</html>
